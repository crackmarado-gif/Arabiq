window.PT=[0.0,5.16,17.77,30.68,46.31,50.44,63.72,72.79,81.36,89.26];window.DURATION=97.0;

function cam(cx,cy,s,r=0){tf(BOARD,`translate(540 960) scale(${s}) rotate(${r}) translate(${-cx} ${-cy})`)}
function showEv(name,k){LAYERS.forEach(n=>op(EV[n],n===name?k:0))}

window.render=function(t){
  const P=window.PT,END=window.DURATION;const seg=P.findLastIndex(x=>t>=x);const i=Math.max(0,seg);const t0=P[i],t1=i<P.length-1?P[i+1]:END;const lt=t-t0;

    case 1:{cam(275,640,1.5);dimIn(t0,t1);op(EV.e1,evIn(t0+.2,t1));tf(EV.e1,`translate(0 ${40*(1-eo(p(t,t0+.2,t0+.8)))})`);
      reveal('a0',t,t0+.3,t1-.5);reveal('a1',t,t0+.5,t1-.5);reveal('a2',t,t0+4.5,t1-.5);

    case 2:{cam(275,640,1.5);dimIn(t0,t1);op(EV.e2,evIn(t0+.2,t1));

      EV.e2dots.forEach((d,j)=>{const on=t>t0+8.6+j*.07;d.c.setAttribute('fill',on?(d.fr?C.red:C.gr):'#E2D8C8');d.ic.textContent=on?(d.fr?'FR':'✓'):'';
        tf(d.gg,`translate(${-340+(j%9)*85} ${-30+Math.floor(j/9)*95}) scale(${on?1+.25*Math.sin(Math.PI*p(t,t0+8.6+j*.07,t0+8.9+j*.07)):1})`)});
      stampAnim(EV.e2st,t,t0+10.6);break}
    case 3:{cam(275,640,1.5);dimIn(t0,t1);op(EV.e3,evIn(t0+.2,t1));
      reveal('c0',t,t0+.3,t1-.5);reveal('c1',t,t0+3.2,t1-.5);
      EV.e3dead.textContent=Math.round(eo(p(t,t0+.6,t0+3))*15000).toLocaleString('fr-FR').replace(/ | /g,' ')+' morts';
      const big=EV.e3year.parentNode;op(big,1-p(t,t0+3.0,t0+3.5));
      op(EV.e3doc,p(t,t0+3.3,t0+3.8));tf(EV.e3doc,`translate(540 ${lerp(1500,1180,eo(p(t,t0+3.3,t0+4)))}) rotate(-1.5)`);
      const rt=[7.8,9.3,11.8,13.1,14.5];EV.e3rows.forEach((r,j)=>{op(r.r,p(t,t0+3.8+j*.15,t0+4.2+j*.15));const mk=p(t,t0+rt[j],t0+rt[j]+.3);op(r.mk,mk>0?1:0);tf(r.mk,`scale(${mk>0?.6+.4*back(mk):0})`)});
      if(t>t1-1.0){const z=eio(p(t,t1-1.0,t1));cam(lerp(275,540,z),lerp(640,900,z),lerp(1.5,.8,z))}

      tf(CARDS.s2,`translate(805 700) rotate(${4+Math.sin(t*3)*1.5*p(t,t0+1,t0+2)})`);break}
    case 5:{{const z=eio(p(t,t0,t0+.7));cam(805,lerp(760,700,z),lerp(1.3,1.5,z));}dimIn(t0,t1);op(EV.e5,evIn(t0+.2,t1));

      EV.e5crowd.forEach((c,j)=>op(c,p(t,t0+1+j*.04,t0+1.3+j*.04)));

      [0,1,2].forEach(k=>strings[k].setAttribute('stroke-width',4+3*Math.max(0,Math.sin(t*4))*p(t,t0+.5,t0+1.2)*(1-p(t,t0+2.8,t0+3.2))));
      if(t>t0+3.0){op(DIM,.7*p(t,t0+3.0,t0+3.6));op(BACKSAM,p(t,t0+3.1,t0+3.7));tf(BACKSAM,`translate(540 ${lerp(1900,1640,eo(p(t,t0+3.1,t0+3.9)))}) scale(1.2)`)}
      reveal('i2',t,t0+3.2,END+2);reveal('i3',t,t0+4.7,END+2);break}
  }
  // round transitions into/out of evidence
  wipe.style.clipPath='circle(0px at 540px 960px)';
};
