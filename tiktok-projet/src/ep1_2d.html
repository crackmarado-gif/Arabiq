<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Oswald;font-weight:700;src:url(fonts/oswald-latin-700-normal.woff2)}
@font-face{font-family:Rubik;font-weight:500;src:url(fonts/rubik-latin-500-normal.woff2)}
@font-face{font-family:Rubik;font-weight:700;src:url(fonts/rubik-latin-700-normal.woff2)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#F3EDE2}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden}
svg{position:absolute;left:0;top:0}
.ui{position:absolute;z-index:5}
.lbl{font-family:Rubik;font-weight:700;font-size:30px;letter-spacing:5px;text-transform:uppercase}

.m{display:block;overflow:hidden;padding-bottom:6px}
.m>span{display:inline-block;will-change:transform}
.acc{color:#FF6B35}.gr{color:#3CC47C}
#grain{position:absolute;inset:0;z-index:9;pointer-events:none;opacity:.045;
  background-image:radial-gradient(#000 .8px,transparent 1px);background-size:4px 4px}
#wipe{position:absolute;inset:0;z-index:8;pointer-events:none}
</style></head>
<body><div id="stage">
<svg id="S" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
<div id="scrim" style="position:absolute;left:0;top:0;width:1080px;height:1000px;z-index:4;pointer-events:none"></div><div id="ui"></div>
<div id="wipe"></div>
<div id="grain"></div>
</div>
<script>
/* ============ helpers ============ */
const NS='http://www.w3.org/2000/svg', S=document.getElementById('S');
function el(tag,a={},parent=S){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);parent.appendChild(e);return e}
const g=(parent=S,a={})=>el('g',a,parent);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)), p=(t,a,b)=>clamp((t-a)/(b-a)), lerp=(a,b,k)=>a+(b-a)*k;
const eo=x=>1-Math.pow(1-x,3), eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2, e5=x=>x<.5?16*x**5:1-Math.pow(-2*x+2,5)/2;
const back=x=>{const c=1.4,c3=c+1;return 1+c3*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const smooth=k=>k-Math.sin(2*Math.PI*k)/(2*Math.PI);
function hash(n){const x=Math.sin(n*127.1+.3)*43758.5453;return x-Math.floor(x)}
const hex=h=>h.match(/\w\w/g).map(v=>parseInt(v,16));
const mix=(a,b,k)=>{const A=hex(a),B=hex(b);return 'rgb('+A.map((v,i)=>Math.round(lerp(v,B[i],k))).join(',')+')'};
const tf=(e,s)=>e.setAttribute('transform',s);
const op=(e,o)=>e.setAttribute('opacity',clamp(o));
const defs=el('defs');
function lin(id,stops,x2=0,y2=1){const l=el('linearGradient',{id,x1:0,y1:0,x2,y2},defs);stops.forEach(([o,c,a=1])=>el('stop',{offset:o,'stop-color':c,'stop-opacity':a},l));return l}
function rad(id,stops){const l=el('radialGradient',{id},defs);stops.forEach(([o,c,a=1])=>el('stop',{offset:o,'stop-color':c,'stop-opacity':a},l));return l}
rad('sunGlow',[[0,'#FFD27A',.9],[.45,'#FFB45A',.35],[1,'#FFB45A',0]]);
rad('hotGlow',[[0,'#FF6B35',.55],[.6,'#FF6B35',.18],[1,'#FF6B35',0]]);
rad('coolGlow',[[0,'#5FC3FF',.45],[.6,'#5FC3FF',.14],[1,'#5FC3FF',0]]);
rad('moonGlow',[[0,'#FFF4D6',.5],[1,'#FFF4D6',0]]);
lin('heatLine',[[0,'#FFB45A'],[1,'#FF4A1A']],1,0);
const filt=el('filter',{id:'soft',x:'-50%',y:'-50%',width:'200%',height:'200%'},defs);el('feGaussianBlur',{stdDeviation:10},filt);
const shadowF=el('filter',{id:'shadow',x:'-20%',y:'-20%',width:'140%',height:'160%'},defs);
el('feDropShadow',{dx:0,dy:14,stdDeviation:16,'flood-color':'#3a2410','flood-opacity':.18},shadowF);

/* ============ palette ============ */
const C={cream:'#F3EDE2',ink:'#1B1E1C',or:'#FF6B35',gr:'#3CC47C',skin:'#A8704B',hair:'#2A1D17',top:'#FF6B35',pants:'#34405A',
  b1:'#E4D6C3',b1s:'#D2C1AA',b2:'#DCCAB2',b2s:'#C8B39A',win:'#3C4250',lit:'#FFC46B',ground:'#D9CBB7',road:'#A79D91',night:'#161B33'};

/* ============ Samia (side) ============ */
function samia(parent){
  const r=g(parent);
  const legB=g(r);el('rect',{x:-13,y:0,width:26,height:132,rx:13,fill:'#2B3549'},legB);el('ellipse',{cx:9,cy:132,rx:22,ry:10,fill:'#1d1d22'},legB);
  const armB=g(r);el('rect',{x:-10,y:0,width:20,height:104,rx:10,fill:'#8f5d3e'},armB);
  el('rect',{x:-40,y:-130,width:80,height:138,rx:36,fill:C.top},r);
  el('path',{d:'M-40 -60 h80 v40 a36 36 0 0 1 -36 28 h-8 a36 36 0 0 1 -36 -28z',fill:'#E85A28',opacity:.55},r);
  const legF=g(r);el('rect',{x:-13,y:0,width:26,height:132,rx:13,fill:C.pants},legF);el('ellipse',{cx:9,cy:132,rx:22,ry:10,fill:'#232328'},legF);
  const armF=g(r);el('rect',{x:-10,y:0,width:20,height:104,rx:10,fill:C.skin},armF);
  el('rect',{x:-10,y:-150,width:20,height:26,fill:C.skin},r);
  const head=g(r);
  el('circle',{cx:4,cy:-186,r:40,fill:C.skin},head);
  el('path',{d:'M-36 -186 a40 40 0 0 1 78 -12 q-30 -4 -46 10 q-8 18 -32 22z',fill:C.hair},head);
  el('circle',{cx:-34,cy:-222,r:18,fill:C.hair},head);
  el('circle',{cx:26,cy:-188,r:4.5,fill:'#1a1a1a'},head);
  el('ellipse',{cx:22,cy:-170,rx:9,ry:5,fill:'#D8876A',opacity:.7},head);
  const drop=el('path',{d:'M50 -214 q8 13 0 18 q-8 -5 0 -18z',fill:'#8FD0FF'},head);
  return {r,legB,legF,armB,armF,head,drop};
}
function walk(s,ph,amp=1){const a=Math.sin(ph)*24*amp;
  tf(s.legF,`translate(0 0) rotate(${a})`);tf(s.legB,`rotate(${-a})`);
  tf(s.armF,`translate(0 -112) rotate(${-a*.85})`);tf(s.armB,`translate(0 -112) rotate(${a*.85})`);
  tf(s.head,`translate(0 ${Math.abs(Math.cos(ph))*-3}) rotate(${Math.sin(ph*2)*1.2})`)}

/* ============ scene groups ============ */
const SKY=el('rect',{x:0,y:0,width:1080,height:1920,fill:C.cream});
const STARS=g();for(let i=0;i<80;i++)el('circle',{cx:hash(i)*1080,cy:hash(i*7)*1100,r:1.5+hash(i*3)*2.2,fill:'#FFF4D6',opacity:.5+hash(i*9)*.5},STARS);
const SUN=g();el('circle',{cx:0,cy:0,r:330,fill:'url(#sunGlow)'},SUN);el('circle',{cx:0,cy:0,r:130,fill:'#FFC25A'},SUN);el('circle',{cx:-30,cy:-30,r:88,fill:'#FFD27E',opacity:.6},SUN);
const MOON=g();el('circle',{cx:0,cy:0,r:240,fill:'url(#moonGlow)'},MOON);el('circle',{cx:0,cy:0,r:70,fill:'#FFF1CF'},MOON);el('circle',{cx:28,cy:-18,r:62,fill:C.night,opacity:.0},MOON);

/* --- CITY (street + towers) : world coords, camera applied --- */
const CITY=g();
const FAR=g(CITY);
for(let i=0;i<9;i++){const w=170+hash(i)*140,h=380+hash(i*4)*420,x=-400+i*300;el('rect',{x,y:1500-h,width:w,height:h,rx:10,fill:'#E9DDCB'},FAR)}
const MID=g(CITY);
const towers=[];const allWins=[];let samWin;
function tower(x,w,h,col,shade,id){const t=g(MID);
  el('rect',{x,y:1500-h,width:w,height:h,rx:14,fill:col},t);
  el('rect',{x:x+w*.72,y:1500-h,width:w*.28,height:h,rx:14,fill:shade},t);
  el('rect',{x:x-8,y:1500-h-18,width:w+16,height:24,rx:10,fill:shade},t);
  const cols=Math.floor((w-60)/90), rows=Math.floor((h-120)/110);
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const wx=x+(w-cols*90)/2+c*90+18, wy=1500-130-r*110;
    const isS=(id==='S'&&r===8&&c===1);
    const wn=el('rect',{x:wx,y:wy,width:54,height:72,rx:8,fill:C.win},t);
    allWins.push({el:wn,th:hash(r*13+c*7+x),s:isS});if(isS)samWin={el:wn,x:wx+27,y:wy+36};
    el('rect',{x:wx-6,y:wy+74,width:66,height:8,rx:4,fill:shade,opacity:.8},t)}
  towers.push({t,x,w,h});return t}
tower(-160,330,980,C.b2,C.b2s);tower(250,300,720,C.b1,C.b1s);tower(600,330,1500,C.b2,C.b2s,'S');tower(1000,320,880,C.b1,C.b1s);tower(1380,330,1180,C.b2,C.b2s);
// door S
el('rect',{x:735,y:1360,width:70,height:140,rx:8,fill:'#6B4B3A'},MID);
const GROUND=g(CITY);
el('rect',{x:-600,y:1500,width:2600,height:600,fill:C.ground},GROUND);
el('rect',{x:-600,y:1500,width:2600,height:26,fill:'#E7DCCB'},GROUND);
el('rect',{x:-600,y:1640,width:2600,height:400,fill:C.road},GROUND);
for(let x=-600;x<2000;x+=160)el('rect',{x,y:1770,width:90,height:10,rx:5,fill:'#E7DCCB'},GROUND);
function tree2d(parent,x,y,s,col='#A9A46A',col2='#8F8A55'){const t=g(parent);tf(t,`translate(${x} ${y}) scale(${s})`);
  el('rect',{x:-8,y:-160,width:16,height:160,rx:8,fill:'#7B5A42'},t);
  el('circle',{cx:0,cy:-200,r:78,fill:col},t);el('circle',{cx:-48,cy:-170,r:52,fill:col},t);el('circle',{cx:50,cy:-172,r:56,fill:col},t);
  el('circle',{cx:28,cy:-182,r:50,fill:col2,opacity:.5},t);return t}
tree2d(MID,170,1500,.9);tree2d(MID,560,1500,.75);tree2d(MID,980,1500,.85);
// pharmacy cross
const CROSS=g(MID);tf(CROSS,'translate(520 1500)');
el('rect',{x:-5,y:-300,width:10,height:300,rx:5,fill:'#7a7a7a'},CROSS);
el('path',{d:'M-34 -460 h68 v68 h68 v68 h-68 v68 h-68 v-68 h-68 v-68 h68z',fill:'#2FB36A'},CROSS);
el('rect',{x:-92,y:-380,width:184,height:56,rx:10,fill:'#0F2A1A'},CROSS);
const crossTxt=el('text',{x:0,y:-340,'text-anchor':'middle','font-family':'Oswald','font-weight':700,'font-size':44,fill:'#86FFB6'},CROSS);
// car
const CAR=g(GROUND);
el('rect',{x:-130,y:-70,width:260,height:62,rx:28,fill:'#5F86B8'},CAR);el('path',{d:'M-80 -70 q20 -48 80 -48 q50 0 70 48z',fill:'#5F86B8'},CAR);
el('path',{d:'M-62 -72 q16 -34 62 -34 q38 0 52 34z',fill:'#2C3A48'},CAR);
el('circle',{cx:-75,cy:-8,r:26,fill:'#222'},CAR);el('circle',{cx:75,cy:-8,r:26,fill:'#222'},CAR);
const SAM=samia(CITY);
// heat lines layer (world)
const HEAT=g(CITY);
const heatLines=[];for(let i=0;i<26;i++){const pth=el('path',{fill:'none',stroke:'url(#heatLine)','stroke-width':9,'stroke-linecap':'round',opacity:0},HEAT);heatLines.push(pth)}
const rays=[];for(let i=0;i<10;i++)rays.push(el('line',{stroke:'#FFC25A','stroke-width':10,'stroke-linecap':'round',opacity:0},HEAT));
const NIGHTV=el('rect',{x:-600,y:-800,width:2600,height:3200,fill:'#0E1230',opacity:0});CITY.appendChild(NIGHTV);
// re-append lit windows overlay after night veil
const LIT=g(CITY);const litEls=allWins.map(w=>{const b=w.el.getBBox?null:null;const r=el('rect',{x:w.el.getAttribute('x'),y:w.el.getAttribute('y'),width:54,height:72,rx:8,fill:w.s?C.or:C.lit,opacity:0},LIT);return {r,th:w.th,s:w.s}});
CITY.appendChild(HEAT);

/* --- ROOM --- */
const ROOM=g();
el('rect',{x:-1500,y:-1500,width:4000,height:5000,fill:'#232A47'},ROOM);
el('rect',{x:-1500,y:1360,width:4000,height:2000,fill:'#1A1F37'},ROOM);
const RWIN=g(ROOM);
el('rect',{x:600,y:430,width:380,height:470,rx:16,fill:'#2E3866'},RWIN);
el('rect',{x:618,y:448,width:344,height:434,rx:10,fill:'#121735'},RWIN);
el('circle',{cx:880,cy:530,r:40,fill:'#FFF1CF'},RWIN);
for(let i=0;i<7;i++){const w=40+hash(i)*40,h=120+hash(i*3)*200,x=618+i*50;el('rect',{x,y:882-h,width:Math.min(w,962-x),height:h,fill:'#1F2650'},RWIN);
  for(let k=0;k<5;k++)if(hash(i*9+k)<.5)el('rect',{x:x+8+(k%2)*16,y:882-h+16+Math.floor(k/2)*30,width:8,height:12,fill:C.lit},RWIN)}
el('rect',{x:786,y:448,width:8,height:434,fill:'#2E3866'},RWIN);el('rect',{x:590,y:900,width:400,height:20,rx:8,fill:'#3A4578'},RWIN);
// thermometer
const TH=g(ROOM);tf(TH,'translate(520 690) scale(.85)');el('rect',{x:-16,y:0,width:32,height:250,rx:16,fill:'#E9E4DC'},TH);el('circle',{cx:0,cy:262,r:32,fill:'#E8321E'},TH);
const thLvl=el('rect',{x:-8,y:60,width:16,height:200,rx:8,fill:'#E8321E'},TH);
// bed
const BED=g(ROOM);tf(BED,'translate(0 0)');
el('rect',{x:70,y:1110,width:560,height:150,rx:24,fill:'#7A4C30'},BED);
el('rect',{x:60,y:960,width:36,height:300,rx:14,fill:'#6A3F27'},BED);
el('rect',{x:90,y:1060,width:530,height:70,rx:26,fill:'#EFE6D8'},BED);
el('rect',{x:110,y:1020,width:150,height:60,rx:28,fill:'#FFFFFF'},BED);
const SLEEP=g(BED);
el('circle',{cx:200,cy:1010,r:46,fill:C.skin},SLEEP);
el('path',{d:'M156 1012 a46 46 0 0 1 88 -16 q-34 -6 -54 10 q-8 18 -34 20z',fill:C.hair},SLEEP);
el('circle',{cx:162,cy:978,r:20,fill:C.hair},SLEEP);
const blanket=el('path',{d:'M240 1060 q40 -64 150 -60 q150 4 230 34 v60 h-380z',fill:C.or},SLEEP);
el('path',{d:'M260 1074 q160 -40 360 -10',stroke:'#E85A28','stroke-width':6,fill:'none',opacity:.6},SLEEP);
const SWEAT=el('path',{d:'M250 960 q8 13 0 18 q-8 -5 0 -18z',fill:'#8FD0FF'},ROOM);
// nightstand fan clock
const NSG=g(ROOM);el('rect',{x:660,y:1140,width:150,height:220,rx:16,fill:'#6A3F27'},NSG);
const FAN=g(NSG);tf(FAN,'translate(735 990)');el('rect',{x:-6,y:40,width:12,height:110,rx:6,fill:'#BDBDBD'},FAN);el('ellipse',{cx:0,cy:150,rx:44,ry:10,fill:'#D9D9D9'},FAN);
el('circle',{cx:0,cy:0,r:58,fill:'none',stroke:'#E6E6E6','stroke-width':5},FAN);
const BLADES=g(FAN);for(let i=0;i<3;i++)el('ellipse',{cx:0,cy:-26,rx:14,ry:26,fill:'#8FC4E8',transform:`rotate(${i*120})`},BLADES);el('circle',{cx:0,cy:0,r:9,fill:'#BDBDBD'},FAN);
el('rect',{x:830,y:1250,width:140,height:70,rx:12,fill:'#151515'},NSG);
const CLK=el('text',{x:900,y:1300,'text-anchor':'middle','font-family':'Oswald','font-weight':700,'font-size':46,fill:'#FF4A2E'},NSG);
// standing Samia (back view) for window scene
const BACKSAM=g(ROOM);
el('rect',{x:-90,y:-40,width:180,height:330,rx:80,fill:'#C04E24'},BACKSAM);
el('rect',{x:-110,y:0,width:40,height:230,rx:20,fill:'#7A4A30'},BACKSAM);el('rect',{x:70,y:0,width:40,height:230,rx:20,fill:'#7A4A30'},BACKSAM);
el('rect',{x:-24,y:-80,width:48,height:50,fill:'#7A4A30'},BACKSAM);
el('circle',{cx:0,cy:-120,r:66,fill:C.hair},BACKSAM);el('circle',{cx:0,cy:-200,r:32,fill:C.hair},BACKSAM);
el('rect',{x:-70,y:280,width:60,height:240,rx:26,fill:'#262B3F'},BACKSAM);el('rect',{x:10,y:280,width:60,height:240,rx:26,fill:'#262B3F'},BACKSAM);

/* --- MAP (top-down) --- */
const MAP=g();
el('rect',{x:0,y:0,width:1080,height:1920,fill:'#E8DFD0'},MAP);
const hotHalo=el('ellipse',{cx:540,cy:540,rx:620,ry:470,fill:'url(#hotGlow)'},MAP);
const coolHalo=el('ellipse',{cx:540,cy:1390,rx:640,ry:520,fill:'url(#coolGlow)'},MAP);
for(let i=0;i<5;i++)el('rect',{x:80,y:230+i*150,width:920,height:16,rx:8,fill:'#BDB2A3'},MAP);
for(let i=0;i<5;i++)el('rect',{x:120+i*210,y:230,width:16,height:616,rx:8,fill:'#BDB2A3'},MAP);
for(let r=0;r<4;r++)for(let c=0;c<4;c++){const x=150+c*210,y=260+r*150;for(let k=0;k<2;k++){const w=70+hash(r*5+c+k)*40;el('rect',{x:x+k*92,y:y+10,width:w,height:100,rx:12,fill:hash(r+c*3+k)<.5?'#D7C6AE':'#CDB99E'},MAP)}}
el('path',{d:'M0 1060 q270 -40 540 0 t540 0 v40 q-270 -40 -540 0 t-540 0z',fill:'#7FC4E0'},MAP);
const fcols=['#A9CF7E','#C3D98A','#D8CF86','#98C473','#B5D584'];
for(let r=0;r<4;r++)for(let c=0;c<3;c++)el('rect',{x:70+c*320,y:1150+r*180,width:300,height:160,rx:20,fill:fcols[(r*3+c)%5]},MAP);
for(let i=0;i<26;i++)el('circle',{cx:60+hash(i*3)*960,cy:1150+hash(i*7)*720,r:22+hash(i)*16,fill:i%2?'#5FA152':'#4F8F4A'},MAP);
const mapHeat=[];for(let i=0;i<10;i++)mapHeat.push(el('path',{fill:'none',stroke:'url(#heatLine)','stroke-width':8,'stroke-linecap':'round',opacity:0},MAP));
const lblV=g(MAP);el('rect',{x:-80,y:-32,width:160,height:64,rx:32,fill:C.or},lblV);el('text',{x:0,y:13,'text-anchor':'middle','font-family':'Rubik','font-weight':700,'font-size':36,fill:'#fff'},lblV).textContent='Ville';
const lblC=g(MAP);el('rect',{x:-120,y:-32,width:240,height:64,rx:32,fill:C.gr},lblC);el('text',{x:0,y:13,'text-anchor':'middle','font-family':'Rubik','font-weight':700,'font-size':36,fill:'#fff'},lblC).textContent='Campagne';

/* --- COUNTRY --- */
const CTRY=g();
el('rect',{x:0,y:0,width:1080,height:1920,fill:'#DCEFF2'},CTRY);
const CSUN=g(CTRY);el('circle',{cx:0,cy:0,r:260,fill:'url(#sunGlow)'},CSUN);el('circle',{cx:0,cy:0,r:100,fill:'#FFC25A'},CSUN);
el('path',{d:'M0 1300 q300 -60 540 -20 t540 -10 v650 h-1080z',fill:'#A9CF7E'},CTRY);
el('path',{d:'M0 1420 q300 -40 540 0 t540 0 v500 h-1080z',fill:'#94C46E'},CTRY);
const shade=el('ellipse',{cx:540,cy:1440,rx:300,ry:40,fill:'#5E8F47',opacity:.45},CTRY);
const BIGTREE=g(CTRY);tf(BIGTREE,'translate(540 1440) scale(2.05)');
el('rect',{x:-12,y:-190,width:24,height:190,rx:12,fill:'#7B5A42'},BIGTREE);
[[0,-250,95],[-62,-212,66],[64,-214,70],[-30,-290,60],[36,-280,62]].forEach(([x,y,r],i)=>el('circle',{cx:x,cy:y,r,fill:i%2?'#5FA152':'#4F9A4A'},BIGTREE));
el('circle',{cx:30,cy:-250,r:60,fill:'#7DBE66',opacity:.5},BIGTREE);
tree2d(CTRY,120,1330,1.0,'#6FB25A','#5A9A48');tree2d(CTRY,960,1320,1.1,'#6FB25A','#5A9A48');
const drops=[];for(let i=0;i<22;i++)drops.push(el('circle',{r:9+hash(i)*7,fill:'#8FD0FF',opacity:0},CTRY));
